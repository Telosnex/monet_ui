name: monet_ui
description: >-
  Material You color for any Flutter design: themes from a seed or an image,
  contrast in APCA and WCAG, color spaces, Google Fonts and Material shapes.
version: 1.2.3
repository: https://github.com/Telosnex/monet_ui
issue_tracker: https://github.com/Telosnex/monet_ui/issues
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  androidx_graphics_shapes: ^2.0.0
  # lib/fonts/tooling (SHA-256 of the google_fonts source).
  crypto: ^3.0.3
  flutter:
    sdk: flutter
  json_annotation: ^4.9.0
  meta: ^1.16.0
  squadron: ^7.1.0

  material_ui: ^1.4.0
  cupertino_ui: ^1.1.1
dev_dependencies:
  json_serializable: ^6.7.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  material_color_utilities: '>=0.11.1 <0.14.0'
  google_fonts: ^9.0.0
  build_runner:
  squadron_builder: ^9.0.0+2
  test: ^1.26.3
  matcher: ^0.12.16
  perf_tester: ^1.0.0

